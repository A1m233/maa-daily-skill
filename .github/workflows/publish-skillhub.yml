name: Publish SkillHub

on:
  push:
    branches: [main]
    paths:
      - 'maa-daily/**'
      - 'LICENSE'
      - 'scripts/*skillhub*.py'
      - 'tests/**'
      - '.github/workflows/publish-skillhub.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry-run package version (no upload)'
        required: true
        default: '0.1.0'
      publish:
        description: 'Sync main to SkillHub (default is dry-run only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skillhub-publish
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read current main after acquiring concurrency; an older queued push cannot publish old code.
          ref: ${{ github.event_name == 'push' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test skill and publishing
        run: python -B -m unittest discover -s tests -v
      - name: Fetch verified official CLI
        run: python scripts/fetch_skillhub_cli.py --output "$RUNNER_TEMP/skillhub-cli"
      - name: Build, validate and sync
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_KEY }}
          INPUT_VERSION: ${{ inputs.version || '0.1.0' }}
          DO_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          args=(--cli "$RUNNER_TEMP/skillhub-cli/skills_store_cli.py" --output dist/skillhub)
          if [ "$DO_PUBLISH" = true ]; then
            args+=(--publish)
          else
            args+=(--version "$INPUT_VERSION")
          fi
          python scripts/sync_skillhub.py "${args[@]}"
      - name: Save package, manifest and submission evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillhub-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/skillhub/
          retention-days: 30
          if-no-files-found: ignore
