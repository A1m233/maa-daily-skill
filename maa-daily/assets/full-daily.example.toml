# 完整参考模板：复制到 `$(maa dir config)/tasks/` 后，逐项 review 再使用。
# 已验证基线：maa-cli 0.7.5 / MaaCore 6.16.8。
# 这是安全默认值，不包含账号名、设备、profile 或私人路径。

[[tasks]]
name = "启动明日方舟"
type = "StartUp"
params = { client_type = "Official", start_game_enabled = true }

[[tasks]]
name = "公招：领取上一轮并最多开启四个新槽位"
type = "Recruit"
# 默认保护五星：允许识别五星组合，但不自动确认。用户明确授权后才把 5 加入 confirm。
params = { refresh = true, select = [4, 5], confirm = [3, 4], times = 4, set_time = true, expedite = false, preserve_tags = ["支援机械"], recruitment_time = { 3 = 540, 4 = 540 } }

[[tasks]]
name = "信用商店：领取信用并且只买招聘许可"
type = "Custom"
# 依赖本 Skill 的 strict-credit-recruit-permit 用户资源以及 profile 中的 user_resource = true。
params = { task_names = ["MaaDailyCredit@MallBegin"] }

[[tasks]]
name = "基建：只做总览收取，不换班、不用无人机"
type = "Infrast"
# mode 20000 只执行一次游戏内队列轮换/整理链，不等于清空左下角全部待办。
params = { mode = 0, facility = [], drones = "_NotUse", continue_training = false }

# 可选的周一剿灭有界示例，默认保持注释。全权委托按无助战历史最高歼灭数
# 结算；扫荡券不足后的普通代理则回放当前保存记录，两者必须分开验证。
# 只有固定账号列表中的每个账号都已在同一明确地图取得无助战 400 杀并解锁
# 全权委托时才启用；不要用裸 `Annihilation` 代替明确选图。
# 默认只示范 1 次，不承诺清满周上限。只有当前扫荡券库存足以覆盖计划次数，
# 或每个账号的普通代理都已另行真实验证能稳定完成 400 杀时，才扩大 times。
# [[tasks]]
# name = "周一优先清理剿灭"
# type = "Fight"
# [[tasks.variants]]
# condition = { type = "Weekday", weekdays = ["Mon"], timezone = "Official" }
# params = { stage = "LungmenDowntown@Annihilation", medicine = 0, medicine_expire_days = 0, stone = 0, times = 1, series = 1 }

[[tasks]]
name = "清理自然理智：固定常驻关卡"
type = "Fight"
# 单倍保留为无需动态编排的保守基线；先读 references/daily-checks.md 复用高倍率计算。
# 识别原型未验证前不要直接替换本链；芯片等材料目标不默认清空理智。
params = { stage = "1-7", medicine = 0, stone = 0, times = 999, series = 1 }

# 如果改用按星期开放的关卡，为 Weekday condition 显式设置服务器游戏日时区，并用 -vv dry-run
# 核对最终 stage。例如：
# [[tasks.variants]]
# condition = { type = "Weekday", weekdays = ["Mon", "Thu", "Sat", "Sun"], timezone = "Official" }
# params = { stage = "AP-5" }

[[tasks]]
name = "领取日常与周常任务奖励"
type = "Award"
# Completed 不证明每日合成玉/扫荡券已领。Agent 仍须按 safety-and-results.md 收尾核验并提醒。
params = { award = true, mail = false, recruit = false, orundum = false, mining = false, specialaccess = false }
